<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
    <meta name="theme-color" content="#2563eb">
    <meta name="format-detection" content="telephone=no">
    <title>یادداشت‌یار — مدیریت کارها</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="یادداشت‌یار">
    <link rel="apple-touch-icon" href="assets/img/maskable-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/maskable-512.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/img/maskable-512.png">

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- ============================================================
         استایل فاکتور — فقط برای پیش‌نمایش داخل اپ
         (خروجی تصویر از inline styles استفاده می‌کنه)
         ============================================================ -->
    <style>
      /* فاکتور — پیش‌نمایش درون اپ */
      .invoice-card {
        width: 100%;
        background: #ffffff;
        color: #1e293b;
        font-family: 'Vazirmatn', 'Vazir', Tahoma, sans-serif;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        direction: rtl;
        text-align: right;
        font-feature-settings: "ss01";
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .invoice-card * {
        letter-spacing: 0 !important;
        word-spacing: normal;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .invoice-header {
        background: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%);
        color: #fff;
        padding: 24px 22px 20px;
        position: relative;
        overflow: hidden;
      }
      .invoice-header::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -20%;
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
      }
      .invoice-header::after {
        content: "";
        position: absolute;
        bottom: -60%;
        right: -15%;
        width: 250px;
        height: 250px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 50%;
      }
      .invoice-store-name {
        font-family: 'Vazirmatn', 'Vazir', Tahoma, sans-serif;
        font-size: 22px;
        font-weight: 800;
        margin: 0 0 6px;
        padding: 0;
        position: relative;
        z-index: 2;
        letter-spacing: 0 !important;
        word-spacing: 0 !important;
        direction: rtl;
        text-align: right;
        unicode-bidi: embed;
        white-space: nowrap;
        overflow: visible;
        line-height: 1.6;
        text-rendering: geometricPrecision;
      }
      .invoice-store-sub {
        font-family: 'Vazirmatn', 'Vazir', Tahoma, sans-serif;
        font-size: 12px;
        opacity: 0.85;
        margin: 0;
        position: relative;
        z-index: 2;
        font-weight: 400;
        letter-spacing: 0 !important;
        direction: rtl;
        text-align: right;
        line-height: 1.5;
      }
      .invoice-badge {
        display: inline-block;
        background: rgba(255, 255, 255, 0.2);
        padding: 4px 14px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        margin-top: 12px;
        position: relative;
        z-index: 2;
        border: 1px solid rgba(255, 255, 255, 0.3);
        letter-spacing: 0 !important;
        direction: rtl;
      }
      .invoice-meta {
        padding: 18px 22px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        background: #f8fafc;
        border-bottom: 1px dashed #cbd5e1;
      }
      .invoice-meta-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        direction: rtl;
        text-align: right;
      }
      .invoice-meta-item .label {
        font-size: 10px;
        color: #64748b;
        font-weight: 600;
        letter-spacing: 0 !important;
      }
      .invoice-meta-item .value {
        font-size: 13px;
        color: #1e293b;
        font-weight: 700;
        letter-spacing: 0 !important;
      }
      .invoice-body {
        padding: 20px 22px;
      }
      .invoice-section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        color: #1e40af;
        margin: 0 0 12px;
        padding-bottom: 8px;
        border-bottom: 2px solid #e0e7ff;
        letter-spacing: 0 !important;
        direction: rtl;
      }
      .invoice-section-title i { font-size: 16px; }
      .invoice-item {
        background: #f8fafc;
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
        border-right: 4px solid #2563eb;
        direction: rtl;
        text-align: right;
      }
      .invoice-item-title {
        font-family: 'Vazirmatn', 'Vazir', Tahoma, sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 6px;
        letter-spacing: 0 !important;
        direction: rtl;
        text-align: right;
        line-height: 1.6;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .invoice-item-desc {
        font-family: 'Vazirmatn', 'Vazir', Tahoma, sans-serif;
        font-size: 12px;
        color: #64748b;
        margin: 0 0 10px;
        line-height: 1.7;
        letter-spacing: 0 !important;
        direction: rtl;
        text-align: right;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .invoice-item-rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .invoice-item-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: #475569;
        direction: rtl;
        letter-spacing: 0 !important;
      }
      .invoice-item-row .row-label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #64748b;
        letter-spacing: 0 !important;
      }
      .invoice-item-row .row-value {
        font-weight: 600;
        color: #1e293b;
        letter-spacing: 0 !important;
      }
      .invoice-total {
        background: linear-gradient(135deg, #ecfdf5, #d1fae5);
        border: 2px solid #10b981;
        border-radius: 14px;
        padding: 16px 18px;
        margin-top: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        direction: rtl;
      }
      .invoice-total-label {
        font-size: 14px;
        font-weight: 700;
        color: #065f46;
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: 0 !important;
      }
      .invoice-total-value {
        font-size: 20px;
        font-weight: 800;
        color: #059669;
        letter-spacing: 0 !important;
        direction: rtl;
      }
      .invoice-total-value .unit {
        font-size: 11px;
        font-weight: 500;
        opacity: 0.8;
        margin-right: 4px;
        letter-spacing: 0 !important;
      }
      .invoice-footer {
        padding: 16px 22px 20px;
        background: #f8fafc;
        text-align: center;
        border-top: 1px dashed #cbd5e1;
        direction: rtl;
      }
      .invoice-footer .thanks {
        font-size: 14px;
        font-weight: 700;
        color: #1e40af;
        margin: 0 0 6px;
        letter-spacing: 0 !important;
      }
      .invoice-footer .contact {
        font-size: 11px;
        color: #64748b;
        margin: 0;
        line-height: 1.8;
        letter-spacing: 0 !important;
      }
      .invoice-footer .watermark {
        font-size: 9px;
        color: #94a3b8;
        margin-top: 10px;
        opacity: 0.7;
        letter-spacing: 0 !important;
      }
      .invoice-divider {
        height: 4px;
        background: repeating-linear-gradient(
          90deg,
          #2563eb 0px, #2563eb 10px,
          transparent 10px, transparent 20px,
          #10b981 20px, #10b981 30px,
          transparent 30px, transparent 40px
        );
        opacity: 0.15;
      }

      /* Invoice Preview Modal */
      .invoice-preview-modal {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px);
      }
      body.dark-background .invoice-preview-modal {
        background: rgba(0, 0, 0, 0.97);
      }
      .invoice-preview-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 4px;
        gap: 10px;
        flex-shrink: 0;
      }
      .btn-share {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        border: none;
        padding: 10px 22px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
        transition: transform 0.15s ease;
      }
      .btn-share:active { transform: scale(0.95); }
      .btn-share:disabled { opacity: 0.6; cursor: not-allowed; }
      .btn-close-preview {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        border: none;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease;
      }
      .btn-close-preview:hover { background: rgba(255, 255, 255, 0.25); }
      .invoice-preview-scroll {
        flex: 1;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 12px 0;
        -webkit-overflow-scrolling: touch;
      }
      #invoiceRenderArea {
        width: 420px;
        max-width: 100%;
      }
    </style>
  </head>
  <body>

    <!-- ============ Loader ============ -->
    <div id="lode">
      <div class="spinner"></div>
      <p>لطفاً صبر کنید...</p>
    </div>

    <!-- ============ App ============ -->
    <div class="app-container" id="Rudex">

      <!-- Header -->
      <div class="app-header" id="appHeader">
        <div class="header-top">
          <div class="brand-logo">
            <img src="assets/img/maskable-512.png" alt="لوگو">
          </div>
          <div class="search-wrap">
            <i class="bi bi-search"></i>
            <input type="search" class="search-input" placeholder="جستجو در یادداشت‌ها..." id="search" autocomplete="off">
          </div>
        </div>

        <div class="header-actions">
          <button class="action-chip" id="exportPdfBtn" type="button">
            <i class="bi bi-file-earmark-pdf"></i>
            <span>فاکتور</span>
          </button>
          <button class="action-chip" id="enableNotif" type="button">
            <i class="bi bi-bell-slash"></i>
            <span>اعلان</span>
          </button>
          <button class="action-chip" id="switchCheckDarken" type="button">
            <i class="bi bi-moon-stars"></i>
            <span>تم</span>
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card stat-total active" data-filter="all" role="button" tabindex="0" aria-label="نمایش همه">
          <div class="stat-icon"><i class="bi bi-list-task"></i></div>
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">کل</div>
        </div>
        <div class="stat-card stat-done" data-filter="done" role="button" tabindex="0" aria-label="فقط انجام شده‌ها">
          <div class="stat-icon"><i class="bi bi-check2-circle"></i></div>
          <div class="stat-value" id="stat-done">0</div>
          <div class="stat-label">انجام شده</div>
        </div>
        <div class="stat-card stat-urgent" data-filter="urgent" role="button" tabindex="0" aria-label="فقط فوری‌ها">
          <div class="stat-icon"><i class="bi bi-exclamation-triangle"></i></div>
          <div class="stat-value" id="stat-urgent">0</div>
          <div class="stat-label">فوری</div>
        </div>
      </div>

      <!-- Task list -->
      <div id="from"></div>
    </div>

    <!-- FAB -->
    <button class="fab" id="fabAdd" type="button" aria-label="یادداشت جدید">
      <i class="bi bi-plus-lg"></i>
    </button>

    <!-- Bottom bar -->
    <div class="bottom-bar">
      <label class="filter-toggle">
        <input type="checkbox" id="switchCheckDefault">
        <span class="switch"></span>
        <span>فقط انجام شده‌ها</span>
      </label>
      <div class="count-display">
        <i class="bi bi-clipboard-check" style="color: var(--primary);"></i>
        <span id="count" class="fw-bold">0</span>
        <span class="text-muted">مورد</span>
      </div>
    </div>

    <!-- Blur -->
    <div class="blur-layer dis-hide" id="addblur"></div>

    <!-- Form -->
    <div class="form-modal dis-hide" id="display">
      <h5>
        <i class="bi bi-plus-circle" id="form-icon"></i>
        <span id="form-title">یادداشت جدید</span>
      </h5>

      <div class="mb-3">
        <label class="form-label" for="titletask">عنوان</label>
        <input type="text" class="form-control" id="titletask" placeholder="مثلاً: خرید نان" autocomplete="off">
      </div>

      <div class="mb-3">
        <label class="form-label" for="taskDiscript">توضیحات (اختیاری)</label>
        <textarea class="form-control" id="taskDiscript" rows="3" placeholder="جزئیات بیشتر..."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label" for="taskPrice">قیمت (اختیاری) - تومان</label>
        <div class="input-with-icon">
          <i class="bi bi-cash-coin"></i>
          <input type="text" class="form-control" id="taskPrice" placeholder="مثلاً: 2,500,000" inputmode="numeric" autocomplete="off" dir="ltr" style="text-align: right;">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="taskDeadline">تنظیم کردن تاریخ (اختیاری) - شمسی</label>
        <div class="input-with-clear">
          <input type="text" class="form-control" id="taskDeadline" placeholder="انتخاب تاریخ و ساعت..." autocomplete="off">
          <button type="button" class="btn-clear-deadline dis-hide" id="clearDeadlineBtn" aria-label="پاک کردن تاریخ">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-primary-gradient" id="create2" type="button">
          <i class="bi bi-check-lg"></i>
          <span id="submit-text">ذخیره</span>
        </button>
        <button class="btn-ghost" id="cancelForm" type="button">انصراف</button>
      </div>
    </div>

    <!-- Confirm Delete -->
    <div class="confirm-modal dis-hide" id="ask">
      <div class="icon-warn">
        <i class="bi bi-trash3"></i>
      </div>
      <h5 class="fw-bold mb-2">حذف یادداشت</h5>
      <p class="mb-4" style="font-size: 13px; line-height: 1.7;">
        آیا از حذف این مورد مطمئن هستید؟ این عمل قابل بازگشت نیست.
      </p>
      <div class="d-flex gap-2">
        <button class="btn-danger flex-grow-1" id="yasdelete" type="button">
          <i class="bi bi-trash3"></i> حذف
        </button>
        <button class="btn-ghost flex-grow-1" id="nodeleted" type="button">
          انصراف
        </button>
      </div>
    </div>

    <!-- 🧾 Invoice Preview Modal -->
    <div class="invoice-preview-modal dis-hide" id="invoicePreview">
      <div class="invoice-preview-actions">
        <button class="btn-share" id="shareInvoiceBtn" type="button">
          <i class="bi bi-share-fill"></i>
          <span>اشتراک‌گذاری</span>
        </button>
        <button class="btn-close-preview" id="closePreviewBtn" type="button">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="invoice-preview-scroll">
        <div id="invoiceRenderArea"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast-container"></div>

  
    <pwa-install use-local-storage="true" install-description="برای تجربه بهتر، اپ ما را نصب کنید!"></pwa-install>
  </body> <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="assets/js/app.js"></script>

    <!-- pwa installer -->
     <script type="module" src="https://cdn.jsdelivr.net/npm/@khmyznikov/pwa-install@latest/dist/index.min.js"></script>
</html>
